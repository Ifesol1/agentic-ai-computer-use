[package]
name = "client"
description = "A typed client for the harness API, used by the app and by tests"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# `client::spawn_mock`: the scripted backend inside this process, for the app
# and UI tests. Off by default so nothing ships with it by accident.
mock = ["dep:api"]

[dependencies]
proto.workspace = true
api = { workspace = true, optional = true }
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
api.workspace = true
axum.workspace = true
